<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StaTome" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css?v=19" />
  <script src="/zbar-wasm.js?v=19"></script>
  <script src="/html5-qrcode.min.js?v=19"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" defer></script>
  <title>StaTome — Suivi de Lecture</title>
  <!-- Cloudflare Web Analytics -->
  <script defer type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "ab5859f59ea84c499606ba87f7d8237c"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>📖</span>
      <span>StaTome</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="sync-badge" id="sync-badge" onclick="window.syncFromServer(true)" style="cursor:pointer;" title="Cliquer pour rafraîchir">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-text">Prêt</span>
      </div>
      <button class="btn" id="account-btn" style="padding:5px 10px;font-size:0.8rem;display:none;" onclick="window.openAccountModal()" title="Mon compte">
        👤
      </button>
    </div>
  </header>

  <main class="container">
    <section id="view-auth" style="display:none;"></section>
    <div id="app-views">
      <section id="view-reading"></section>
      <section id="view-library" style="display:none;"></section>
      <section id="view-add" style="display:none;"></section>
      <section id="view-stats" style="display:none;"></section>
    </div>
  </main>

  <dialog id="app-modal">
    <div id="modal-content"></div>
  </dialog>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-tab="reading" onclick="window.switchTab('reading')">
      <span class="nav-icon">📖</span>
      <span>Lecture</span>
    </button>
    <button class="nav-item" data-tab="library" onclick="window.switchTab('library')">
      <span class="nav-icon">📚</span>
      <span>Biblio</span>
    </button>
    <button class="nav-item" data-tab="add" onclick="window.switchTab('add')">
      <span class="nav-icon">➕</span>
      <span>Ajouter</span>
    </button>
    <button class="nav-item" data-tab="stats" onclick="window.switchTab('stats')">
      <span class="nav-icon">📊</span>
      <span>Stats</span>
    </button>
  </nav>

  <script src="/app.js?v=19"></script>
</body>
</html>
