<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F8FAFC;
      text-align: center;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #0F172A;
      border: 2px solid #6366F1;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    #status {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #94A3B8;
      min-height: 20px;
    }
    #reader__dashboard_section_swaplink { display: none !important; }
  </style>
  <script src="html5-qrcode.min.js"></script>
</head>
<body>
  <div id="reader"></div>
  <div id="status">Initialisation du flux caméra...</div>

  <script>
    function sendValue(val) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: val
      }, "*");
    }

    function setFrameHeight(h) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h
      }, "*");
    }

    // Streamlit handshake
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");

    setFrameHeight(380);

    let hasScanned = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (hasScanned) return;
      hasScanned = true;

      if (navigator.vibrate) {
        navigator.vibrate(200);
      }

      document.getElementById('status').innerHTML =
        '<span style="color: #34D399; font-weight: bold; font-size: 0.95rem;">' +
        '✅ Code détecté : ' + decodedText + ' — Chargement automatique...' +
        '</span>';

      // Envoi direct et immédiat à Streamlit Python
      sendValue(decodedText);

      try {
        html5QrcodeScanner.clear().catch(console.error);
      } catch (e) {
        console.error(e);
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 280, height: 160 },
        aspectRatio: 1.333,
        showTorchButtonIfSupported: true,
        rememberLastUsedCamera: true
      },
      false
    );

    html5QrcodeScanner.render(onScanSuccess, function(err) {});
  </script>
</body>
</html>
